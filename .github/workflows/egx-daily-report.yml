name: EGX Daily Report

on:
  # اختبار حقيقي بعد تعديل إعدادات التقرير فقط.
  push:
    paths:
      - "config.yaml"
      - ".github/workflows/egx-daily-report.yml"
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements*.txt"
      - "run_daily.py"
      - "data/universe.csv"
      - "data/egx33.txt"
      - "data/sharia_extra.csv"

  # GitHub Actions scheduling is heavily delayed/dropped during the 06-09 UTC peak,
  # so we retry every 10 minutes (offset from the top of the hour) across a wider
  # UTC range. Python time windows + state guards decide what actually runs and
  # prevent duplicate reports/reviews, so extra attempts are safe.
  schedule:
    - cron: "7-57/10 6-12 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Force a full run now"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Fetch and analyze data without sending Telegram or committing report output"
        required: false
        default: true
        type: boolean

concurrency:
  group: egx-daily-report-v2
  # Never cancel a run after it may have sent Telegram but before its state is committed.
  # Cancellation in that gap can cause the next scheduled retry to send a duplicate.
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY || secrets.EODHD_API_TOKEN }}
      OANOR_API_KEY: ${{ secrets.OANOR_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PORTFOLIO_ENCRYPTION_KEY: ${{ secrets.PORTFOLIO_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-job.txt

      - name: Run scheduled report or opening review
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # الجدولة الرسمية قد تصل متأخرة عن موعدها؛ بايثون نفسه يقرر داخل كل نافذة
            # (تقرير 08:50–13:00 ومراجعة افتتاح 10:50–14:00 بتوقيت القاهرة)، وحدات
            # التكرار في data/state.json تمنع أي إرسال مكرر في نفس اليوم.
            python run_daily.py
            python run_daily.py --opening-review
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              python run_daily.py --force --dry-run
            else
              python run_daily.py --dry-run
            fi
          elif [ "${{ inputs.force }}" = "true" ]; then
            python run_daily.py --force
          else
            python run_daily.py
          fi

      - name: Commit generated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update EGX daily report"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run offline engine and opening-review tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.changed == 'true'
        run: |
          python tests/test_engine.py
          python tests/test_opening_review.py
          python tests/test_data_freshness.py
      # Deploy Pages in this workflow. A GITHUB_TOKEN-triggered push/dispatch
      # does not reliably start a second workflow, so deployment stays in-run.
      - name: Prepare PWA report data
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p docs/data
          cp data/signals/latest.json docs/data/latest.json

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload PWA artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy PWA
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Diagnose published report freshness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/signals/latest.json")
          if not p.exists():
              print("REPORT_STATUS=missing")
              raise SystemExit(0)
          try:
              report = json.loads(p.read_text(encoding="utf-8"))
              print(f"REPORT_DATA_DATE={report.get('data_date', 'unknown')}")
              print(f"REPORT_GENERATED_AT={report.get('generated_at', 'unknown')}")
              print(f"REPORT_ANALYZED={report.get('analyzed', 'unknown')}")
              print(f"REPORT_UNIVERSE={report.get('universe_size', 'unknown')}")
          except Exception as exc:
              print(f"REPORT_STATUS=invalid_json: {exc}")
          PY

