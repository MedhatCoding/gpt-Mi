# =====================================================================
#  إعدادات محلل الأسهم المصرية
# =====================================================================

market:
  timezone: "Africa/Cairo"
  trading_weekdays: [6, 0, 1, 2, 3]
  report_window: ["08:50", "13:00"] # نافذة واسعة: جدولة GitHub Actions قد تتأخر كثيرًا عن 09:00؛ حراس الحالة في data/state.json يمنعون أي إرسال مكرر
  session_close_hour: 15
universe:
  mode: "sharia_union"
  verification_max_age_days: 180
data:
  history_years: 8
  history_backfill_retry_days: 30
  yahoo_suffix: ".CA"
  benchmark_yahoo_symbol: "^CASE30"
  benchmark_eodhd_symbol: "CASE30.INDX"
  min_bars: 150
  max_stale_days: 4
  eodhd_daily_budget: 20
  request_sleep: 0.3
filters:
  min_avg_value_egp: 1500000
  price_limit_pct: 10
regime:
  weights:
    bench_above_sma50: 0.25
    bench_above_sma200: 0.15
    bench_sma50_rising: 0.10
    breadth_above_sma50: 0.30
    breadth_above_sma200: 0.20
  seasonality_weight: 0.10
  seasonality_min_observations: 4
  strong_up: 0.80
  up: 0.60
  neutral: 0.40
  weak: 0.20
scoring:
  weights:
    trend: 30
    momentum: 25
    relative_strength: 20
    volume: 15
    setup: 10
  buy_score: 70
  watch_score: 55
  avoid_score: 35
  rsi_max_for_buy: 78
  extended_atr_mult: 4.0
  min_room_r: 1.0
risk:
  stop_min_atr: 1.2
  stop_max_atr: 3.0
  swing_lookback: 10
  target_r: [2.0, 3.0]
  risk_per_trade_pct: 1.0
  max_position_pct: 10.0
  max_buys_by_regime:
    strong_up: 5
    up: 4
    neutral: 2
    weak: 1
    down: 0
  regime_min_score: 0.20
  max_hold_days: 20
  round_trip_cost_pct: 0.5
backtest:
  refresh_every_days: 7
  baseline_every_n_bars: 5
ml:
  enabled: true
  score_weight: 0.20
  horizon_days: 10
  positive_return: 0.03
  min_samples: 500
  validation_fraction: 0.10
  validation_folds: 3
  mlp_max_iter: 120
  purge_horizon: true
  min_auc: 0.52
  min_brier_improvement: 0.02
  rf_trees: 120
  rf_depth: 6
llm:
  provider: "gemini"
  anthropic_model: "claude-haiku-4-5-20251001"
  gemini_model: "gemini-2.5-flash"
  max_tokens: 2000
  timeout: 90
telegram:
  enabled: true
  max_picks: 5
  max_watch: 5

# build: 2026-10-08 reliability/news/ml upgrade + tests

portfolio:
  enabled: true
  file: "data/portfolio.json"
  max_single_position_pct: 25

